
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.19.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-node20-v1-{{ checksum "package-lock.json" }}

      - run:
          name: Install Node Dependencies
          command: |
            if [ -d node_modules/express ]; then
              echo "Dependency cache hit!"
            else
              npm ci
            fi

      - save_cache:
          key: npm-node20-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker Image
          command: |
            IMAGE="$DOCKERHUB_USERNAME/circleci-docker-demo"
            mkdir -p /tmp/workspace

            docker build \
              -t "$IMAGE:$CIRCLE_SHA1" \
              -t "$IMAGE:latest" .

            docker save \
              -o /tmp/workspace/image.tar \
              "$IMAGE:$CIRCLE_SHA1" \
              "$IMAGE:latest"

      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - image.tar

  test:
    docker:
      - image: cimg/base:stable

    steps:
      - attach_workspace:
          at: /tmp/workspace

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Test Container Health
          command: |
            IMAGE="$DOCKERHUB_USERNAME/circleci-docker-demo"
            docker load -i /tmp/workspace/image.tar

            docker run -d --name circleci-test "$IMAGE:$CIRCLE_SHA1"

            for i in {1..15}; do
              if docker exec circleci-test node -e '
                const http = require("http");
                http.get("http://127.0.0.1:3000/health", res => {
                  let body = "";
                  res.on("data", chunk => body += chunk);
                  res.on("end", () => {
                    console.log("HTTP:", res.statusCode, body);
                    if (res.statusCode !== 200 || !body.includes("healthy")) {
                      process.exit(1);
                    }
                  });
                }).on("error", () => process.exit(1));
              '; then
                echo "Container health test passed!"
                docker rm -f circleci-test
                exit 0
              fi

              echo "Waiting for application... attempt $i"
              sleep 3
            done

            docker logs circleci-test
            docker rm -f circleci-test || true
            exit 1

  validation:
    docker:
      - image: cimg/base:stable

    steps:
      - attach_workspace:
          at: /tmp/workspace

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Validate Container Health
          command: |
            IMAGE="$DOCKERHUB_USERNAME/circleci-docker-demo"
            docker load -i /tmp/workspace/image.tar

            docker run -d --name circleci-validation "$IMAGE:$CIRCLE_SHA1"

            for i in {1..10}; do
              echo "Validation attempt $i of 10"

              if docker exec circleci-validation node -e '
                const http = require("http");
                http.get("http://127.0.0.1:3000/health", res => {
                  let body = "";
                  res.on("data", chunk => body += chunk);
                  res.on("end", () => {
                    console.log("HTTP:", res.statusCode, body);
                    if (res.statusCode !== 200 || !body.includes("healthy")) {
                      process.exit(1);
                    }
                  });
                }).on("error", () => process.exit(1));
              '; then
                echo "VALIDATION PASSED"
                docker rm -f circleci-validation
                exit 0
              fi

              if [ "$i" -lt 10 ]; then
                sleep 5
              fi
            done

            echo "VALIDATION FAILED"
            docker logs circleci-validation
            docker rm -f circleci-validation || true
            exit 1

  push:
    docker:
      - image: cimg/base:stable

    steps:
      - attach_workspace:
          at: /tmp/workspace

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Push Docker Image
          command: |
            IMAGE="$DOCKERHUB_USERNAME/circleci-docker-demo"
            docker load -i /tmp/workspace/image.tar

            echo "$DOCKERHUB_PASSWORD" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            docker push "$IMAGE:$CIRCLE_SHA1"
            docker push "$IMAGE:latest"

            echo "Docker images pushed successfully!"

workflows:
  docker-ci:
    jobs:
      - build

      - test:
          requires:
            - build

      - validation:
          requires:
            - test

      - push:
          requires:
            - validation
          filters:
            branches:
              only: main
